<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Ocorrência - Dashboard</title>
    <style>
        :root {
            --bg-body: #09070f;
            --sidebar-bg: #100d1a;
            --card-bg: #151121;
            --card-border: #231c33;
            --input-bg: #1b162a;
            --input-border: #2e2645;
            --purple-primary: #8b5cf6;
            --purple-hover: #7c3aed;
            --purple-light: #a78bfa;
            --text-main: #ffffff;
            --text-muted: #8c85a1;
            --danger: #ef4444;

            /* Cores dos Cards de Métricas */
            --card-total-bg: rgba(139, 92, 246, 0.1);
            --card-total-border: rgba(139, 92, 246, 0.3);
            
            --card-abertas-bg: rgba(245, 158, 11, 0.1);
            --card-abertas-border: rgba(245, 158, 11, 0.3);
            --card-abertas-color: #f59e0b;

            --card-andamento-bg: rgba(59, 130, 246, 0.1);
            --card-andamento-border: rgba(59, 130, 246, 0.3);
            --card-andamento-color: #3b82f6;

            --card-resolvidas-bg: rgba(16, 185, 129, 0.1);
            --card-resolvidas-border: rgba(16, 185, 129, 0.3);
            --card-resolvidas-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* --- TELA DE AUTENTICAÇÃO --- */
        .auth-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: radial-gradient(circle at top, #1a0b2e 0%, var(--bg-body) 60%);
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            background: #1e1238;
            border: 1px solid #3d2770;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
        }

        .brand-icon svg { width: 30px; height: 30px; stroke: var(--purple-light); fill: none; stroke-width: 2; }
        .brand-title { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
        .brand-subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }

        .auth-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
        }

        .tab-switcher {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background-color: var(--input-bg);
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--input-border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active { background-color: var(--purple-primary); color: #fff; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }

        .input-control {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .input-control:focus { border-color: var(--purple-primary); }

        .btn-submit {
            width: 100%;
            background-color: var(--purple-primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-submit:hover { background-color: var(--purple-hover); }

        /* --- LAYOUT DA APLICAÇÃO (DASHBOARD) --- */
        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 16px;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            padding: 0 8px;
        }

        .sidebar-brand-icon {
            width: 36px;
            height: 36px;
            background: #1e1238;
            border: 1px solid #3d2770;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sidebar-brand-text h3 { font-size: 16px; font-weight: 800; line-height: 1.2; }
        .sidebar-brand-text span { font-size: 10px; color: var(--purple-light); font-weight: 700; letter-spacing: 1px; }

        .nav-list { list-style: none; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 6px;
            transition: 0.2s;
        }

        .nav-item:hover { color: var(--text-main); background: rgba(255,255,255,0.03); }
        .nav-item.active { background-color: #1e1433; color: var(--purple-light); }

        .sidebar-user {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            background: #2a1b4e;
            color: var(--purple-light);
            font-weight: bold;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .user-details h4 { font-size: 14px; font-weight: 700; }
        .user-details span { font-size: 12px; color: var(--text-muted); text-transform: capitalize; }

        /* Conteúdo Principal */
        .main-content {
            flex: 1;
            padding: 32px 40px;
            overflow-y: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .top-bar h1 { font-size: 26px; font-weight: 800; }
        .top-bar p { color: var(--text-muted); font-size: 14px; margin-top: 2px; }

        .role-badge {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Grid de Cards de Métricas */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        @media (max-width: 1024px) {
            .metrics-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .metric-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            position: relative;
        }

        .metric-card.total { background: var(--card-total-bg); border-color: var(--card-total-border); }
        .metric-card.abertas { background: var(--card-abertas-bg); border-color: var(--card-abertas-border); }
        .metric-card.andamento { background: var(--card-andamento-bg); border-color: var(--card-andamento-border); }
        .metric-card.resolvidas { background: var(--card-resolvidas-bg); border-color: var(--card-resolvidas-border); }

        .metric-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .metric-icon { width: 22px; height: 22px; stroke-width: 2; fill: none; }
        .metric-card.total .metric-icon { stroke: var(--purple-light); }
        .metric-card.abertas .metric-icon { stroke: var(--card-abertas-color); }
        .metric-card.andamento .metric-icon { stroke: var(--card-andamento-color); }
        .metric-card.resolvidas .metric-icon { stroke: var(--card-resolvidas-color); }

        .metric-value { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
        .metric-label { font-size: 13px; color: var(--text-muted); font-weight: 600; }

        /* Card de Seção */
        .section-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 24px;
            min-height: 250px;
        }

        .section-card h3 { font-size: 18px; margin-bottom: 20px; }

        /* Estilização da Lista de Atitudes Inadequadas */
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            padding: 14px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--text-main);
            cursor: pointer;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--purple-primary);
            cursor: pointer;
        }

        .empty-state {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 180px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .item-ocorrencia {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 1. TELA DE AUTENTICAÇÃO -->
    <div id="auth-screen" class="auth-container">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <h1 class="brand-title">Dark Ocorrência</h1>
        <p class="brand-subtitle">Sistema de Ocorrências Escolares</p>

        <div class="auth-card">
            <div class="tab-switcher">
                <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Entrar</button>
                <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Cadastrar</button>
            </div>

            <!-- Login -->
            <form id="form-login" onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="login-email" class="input-control" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="login-password" class="input-control" placeholder="Mínimo 6 caracteres" required>
                </div>
                <button type="submit" class="btn-submit">Entrar</button>
            </form>

            <!-- Cadastro -->
            <form id="form-register" class="hidden" onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="reg-name" class="input-control" placeholder="Ex: Pedro Santos" required>
                </div>
                <div class="form-group">
                    <label>Cargo / Função</label>
                    <select id="reg-role" class="input-control" required>
                        <option value="funcionario">Funcionário (Apenas Lançar)</option>
                        <option value="professor">Professor (Lançar e Visualizar)</option>
                        <option value="diretor">Diretor / Admin (Acesso Total)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="reg-email" class="input-control" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" class="input-control" placeholder="Mínimo 6 caracteres" required>
                </div>
                <button type="submit" class="btn-submit">Criar Conta</button>
            </form>
        </div>
    </div>

    <!-- 2. DASHBOARD / PAINEL DO USUÁRIO -->
    <div id="app-screen" class="app-layout hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div>
                <div class="sidebar-brand">
                    <div class="sidebar-brand-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    </div>
                    <div class="sidebar-brand-text">
                        <h3>Dark</h3>
                        <span>OCORRÊNCIA</span>
                    </div>
                </div>

                <ul class="nav-list">
                    <li class="nav-item active" id="nav-dash" onclick="navegar('dashboard')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                        Dashboard
                    </li>
                    <li class="nav-item" id="nav-oc" onclick="navegar('ocorrencias')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                        Ocorrências
                    </li>
                </ul>
            </div>

            <!-- Perfil do Usuário na Sidebar -->
            <div class="sidebar-user" onclick="logout()" style="cursor: pointer;" title="Clique para sair">
                <div class="avatar" id="user-avatar">P</div>
                <div class="user-details">
                    <h4 id="user-name">Pedro</h4>
                    <span id="user-role">Admin</span>
                </div>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="main-content">
            
            <div class="top-bar">
                <div>
                    <h1 id="page-title">Dashboard</h1>
                    <p id="welcome-msg">Bem-vindo(a), pedro</p>
                </div>
                <div class="role-badge">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span id="header-role">Admin</span>
                </div>
            </div>

            <!-- VISÃO 1: DASHBOARD -->
            <div id="view-dashboard">
                <!-- Métricas -->
                <div class="metrics-grid">
                    <div class="metric-card total">
                        <div class="metric-card-header">
                            <svg class="metric-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg>
                        </div>
                        <div class="metric-value" id="count-total">0</div>
                        <div class="metric-label">Total</div>
                    </div>

                    <div class="metric-card abertas">
                        <div class="metric-card-header">
                            <svg class="metric-icon" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg>
                        </div>
                        <div class="metric-value" id="count-abertas">0</div>
                        <div class="metric-label">Abertas</div>
                    </div>

                    <div class="metric-card andamento">
                        <div class="metric-card-header">
                            <svg class="metric-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg>
                        </div>
                        <div class="metric-value" id="count-andamento">0</div>
                        <div class="metric-label">Em Andamento</div>
                    </div>

                    <div class="metric-card resolvidas">
                        <div class="metric-card-header">
                            <svg class="metric-icon" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg>
                        </div>
                        <div class="metric-value" id="count-resolvidas">0</div>
                        <div class="metric-label">Resolvidas</div>
                    </div>
                </div>

                <!-- Tabela de Ocorrências Recentes -->
                <div class="section-card">
                    <h3>Ocorrências Recentes</h3>
                    <div id="recent-list">
                        <div class="empty-state">Nenhuma ocorrência registrada</div>
                    </div>
                </div>
            </div>

            <!-- VISÃO 2: GERENCIAR/LANÇAR OCORRÊNCIAS -->
            <div id="view-ocorrencias" class="hidden">
                <div class="section-card">
                    <h3>Lançar Nova Ocorrência</h3>
                    <form onsubmit="cadastrarOcorrencia(event)">
                        <div class="form-group">
                            <label>Nome do Aluno</label>
                            <input type="text" id="oc-aluno" class="input-control" placeholder="Ex: João Pedro" required>
                        </div>
                        
                        <!-- Lista de Atitudes Inadequadas da Imagem -->
                        <div class="form-group">
                            <label>Atitudes Inadequadas pelo Aluno:</label>
                            <div class="checkbox-group">
                                <label class="checkbox-item">
                                    <input type="checkbox" name="atitudes" value="Desrespeitar os professores, funcionários e colegas de classe">
                                    Desrespeitar os professores, funcionários e colegas de classe;
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" name="atitudes" value="Desobedecer e tumultuar a aula e a rotina escolar">
                                    Desobedecer e tumultuar a aula e a rotina escolar;
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" name="atitudes" value="Provocação voluntária">
                                    Provocação voluntária;
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" name="atitudes" value="Agredir de forma verbal e física os colegas, professores e funcionários">
                                    Agredir de forma verbal e física os colegas, professores e funcionários;
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" name="atitudes" value="Destruir patrimônio público">
                                    Destruir patrimônio público;
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" name="atitudes" value="Destruir e perder material didático">
                                    Destruir e perder material didático;
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" name="atitudes" value="Uso indevido do celular e aparelhos eletrônicos">
                                    Uso indevido do celular e aparelhos eletrônicos;
                                </label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Descrição Adicional</label>
                            <textarea id="oc-desc" class="input-control" rows="4" placeholder="Detalhes da ocorrência..."></textarea>
                        </div>
                        <button type="submit" class="btn-submit">+ Lançar Registro</button>
                    </form>
                </div>
            </div>

        </main>
    </div>

    <script>
        let currentUser = null;
        let occurrences = [];

        function switchTab(mode) {
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-register').classList.toggle('active', mode === 'register');
            document.getElementById('form-login').classList.toggle('hidden', mode !== 'login');
            document.getElementById('form-register').classList.toggle('hidden', mode !== 'register');
        }

        function handleAuth(e) {
            e.preventDefault();
            const isRegister = !document.getElementById('form-register').classList.contains('hidden');

            if (isRegister) {
                const name = document.getElementById('reg-name').value;
                const role = document.getElementById('reg-role').value;
                currentUser = { name, role };
            } else {
                const email = document.getElementById('login-email').value;
                const name = email.split('@')[0];
                currentUser = { name, role: 'diretor' };
            }

            iniciarDashboard();
        }

        function iniciarDashboard() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');

            const roleFormatted = currentUser.role === 'diretor' ? 'Admin' : currentUser.role;

            document.getElementById('welcome-msg').innerText = `Bem-vindo(a), ${currentUser.name.toLowerCase()}`;
            document.getElementById('user-name').innerText = currentUser.name;
            document.getElementById('user-role').innerText = roleFormatted;
            document.getElementById('header-role').innerText = roleFormatted;
            document.getElementById('user-avatar').innerText = currentUser.name.charAt(0).toUpperCase();

            atualizarInterface();
        }

        function logout() {
            currentUser = null;
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }

        function navegar(aba) {
            document.getElementById('nav-dash').classList.toggle('active', aba === 'dashboard');
            document.getElementById('nav-oc').classList.toggle('active', aba === 'ocorrencias');

            document.getElementById('view-dashboard').classList.toggle('hidden', aba !== 'dashboard');
            document.getElementById('view-ocorrencias').classList.toggle('hidden', aba !== 'ocorrencias');
            
            document.getElementById('page-title').innerText = aba === 'dashboard' ? 'Dashboard' : 'Registrar Ocorrências';
        }

        function cadastrarOcorrencia(e) {
            e.preventDefault();
            const aluno = document.getElementById('oc-aluno').value;
            const desc = document.getElementById('oc-desc').value;

            // Capturar atitudes selecionadas
            const atitudesSelecionadas = Array.from(document.querySelectorAll('input[name="atitudes"]:checked'))
                .map(cb => cb.value);

            if (atitudesSelecionadas.length === 0 && !desc.trim()) {
                alert('Selecione ao menos uma atitude ou escreva uma descrição.');
                return;
            }

            const tipoTexto = atitudesSelecionadas.length > 0 
                ? atitudesSelecionadas.join('; ') 
                : 'Outro';

            occurrences.unshift({ 
                id: Date.now(), 
                aluno, 
                tipo: tipoTexto, 
                desc, 
                status: 'Pendente' 
            });

            // Limpar formulário
            document.getElementById('oc-aluno').value = '';
            document.getElementById('oc-desc').value = '';
            document.querySelectorAll('input[name="atitudes"]').forEach(cb => cb.checked = false);

            alert('Ocorrência lançada!');
            atualizarInterface();
            navegar('dashboard');
        }

        function atualizarInterface() {
            document.getElementById('count-total').innerText = occurrences.length;
            document.getElementById('count-abertas').innerText = occurrences.filter(o => o.status === 'Pendente').length;
            document.getElementById('count-andamento').innerText = occurrences.filter(o => o.status === 'Em andamento').length;
            document.getElementById('count-resolvidas').innerText = occurrences.filter(o => o.status === 'Resolvida').length;

            const recentContainer = document.getElementById('recent-list');
            
            if (currentUser.role === 'funcionario') {
                recentContainer.innerHTML = '<div class="empty-state">Acesso restrito ao histórico de ocorrências.</div>';
                return;
            }

            if (occurrences.length === 0) {
                recentContainer.innerHTML = '<div class="empty-state">Nenhuma ocorrência registrada</div>';
                return;
            }

            recentContainer.innerHTML = '';
            occurrences.forEach(oc => {
                const item = document.createElement('div');
                item.className = 'item-ocorrencia';

                let statusSelect = `<span style="font-size:12px; color:var(--purple-light);">${oc.status}</span>`;
                
                if (currentUser.role === 'diretor') {
                    statusSelect = `
                        <select onchange="alterarStatus(${oc.id}, this.value)" class="input-control" style="width:auto; padding:4px 8px; font-size:12px;">
                            <option value="Pendente" ${oc.status === 'Pendente' ? 'selected':''}>Pendente</option>
                            <option value="Em andamento" ${oc.status === 'Em andamento' ? 'selected':''}>Em andamento</option>
                            <option value="Resolvida" ${oc.status === 'Resolvida' ? 'selected':''}>Resolvida</option>
                        </select>
                    `;
                }

                item.innerHTML = `
                    <div>
                        <strong>${oc.aluno}</strong>
                        <p style="font-size:13px; color:var(--purple-light); margin-top:4px;"><strong>Atitudes:</strong> ${oc.tipo}</p>
                        ${oc.desc ? `<p style="font-size:13px; color:var(--text-muted); margin-top:2px;">${oc.desc}</p>` : ''}
                    </div>
                    <div>${statusSelect}</div>
                `;
                recentContainer.appendChild(item);
            });
        }

        function alterarStatus(id, novoStatus) {
            const item = occurrences.find(o => o.id === id);
            if (item) {
                item.status = novoStatus;
                atualizarInterface();
            }
        }
    </script>
</body>
</html>
